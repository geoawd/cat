site:
  title: "Portal"
  base_url: "/"          # set to "/repo-name/" if not using a custom domain on GitHub Pages
  # Full domain (no trailing slash), e.g. "https://data.example.gov" -- used
  # to build fully-qualified @id URLs in catalog.json / metadata.json.
  # Leave blank to fall back to base_url-relative paths.
  canonical_url: ""
  nav:
    - {label: "Home", href: "index.html"}
    - {label: "Map", href: "map.html"}

# Project CRS. Change epsg/proj4def to whatever your organisation standardises on.
# EPSG:27700 (OSGB36 / British National Grid) is set as a working example.
project:
  epsg: "EPSG:27700"
  proj4def: "+proj=tmerc +lat_0=49 +lon_0=-2 +k=0.9996012717 +x_0=400000 +y_0=-100000 +ellps=airy +datum=OSGB36 +units=m +no_defs"
  # Rough display extent in project CRS units [minx, miny, maxx, maxy]
  extent: [0, 0, 700000, 1300000]
  center: [340000, 550000]
  zoom: 2

# JS/CSS library versions used on the map page, loaded from jsdelivr.
# Pinned explicitly (rather than a "@latest"/major-version-only tag) so a
# rebuild months or years from now still produces byte-for-byte the same
# page — an unpinned CDN reference is exactly the kind of thing that quietly
# breaks a "static archive" once nobody is maintaining it.
libraries:
  openlayers: "9.2.4"
  proj4: "2.11.0"
